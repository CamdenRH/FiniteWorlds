plugins {
    id 'application'
}

dependencies {
    implementation project(':worldgen-core')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'dev.lemma.finiteworlds.tools.PreviewMain'
}

tasks.register('generateWorldPreview', JavaExec) {
    group = 'finite worlds'
    description = 'Generates preview maps for a Finite Worlds seed.'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass

    def previewSeed =
            providers.gradleProperty('seed')
                    .getOrElse('12345')

    def previewType =
            providers.gradleProperty('type')
                    .getOrElse('cascadia')

    args(
            '--seed',
            previewSeed,
            '--type',
            previewType
    )
}
tasks.register('auditTerrain', JavaExec) {
    group = 'finite worlds'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.lemma.finiteworlds.tools.TerrainAuditMain'
    maxHeapSize = '2G'
    args(providers.gradleProperty('seeds').getOrElse('12345,1,42,-987654321').split(','))
}
